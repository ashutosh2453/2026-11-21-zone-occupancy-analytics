[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zone-occupancy-analytics"
version = "0.1.0"
description = "People detection, SORT tracking, zone occupancy, dwell time and line-crossing counts from video, with privacy blurring"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# torch/torchvision are installed separately (CPU or CUDA build of your choice)
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.8", "scikit-image>=0.22", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
occupancy = "occupancy.cli:main"

[tool.setuptools.packages.find]
include = ["occupancy*"]

[tool.setuptools.package-data]
occupancy = ["static/*.html"]
